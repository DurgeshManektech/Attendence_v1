<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>InOut Tracker — Settings</title>
<style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #12151c;
    color: #e7eaf0;
    padding: 24px;
    max-width: 420px;
  }
  h1 { font-size: 16px; margin-bottom: 4px; }
  p { color: #8a93a6; font-size: 12.5px; line-height: 1.5; }
  label { display: block; margin: 16px 0 6px; font-size: 12.5px; color: #8a93a6; }
  input {
    width: 100%;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid #2a2f3a;
    background: #1b1f29;
    color: #e7eaf0;
    font-size: 13px;
    box-sizing: border-box;
  }
  button {
    margin-top: 14px;
    background: #5ee6c4;
    color: #0a1512;
    border: none;
    padding: 9px 16px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
  }
  button.secondary {
    background: #1b1f29;
    color: #e7eaf0;
    border: 1px solid #2a2f3a;
    margin-left: 8px;
  }
  #savedMsg { color: #5ee6c4; font-size: 12px; margin-left: 10px; }
</style>
</head>
<body>
  <h1>InOut Tracker — Settings</h1>
  <p>Your Member ID is automatically detected from whoever is currently logged into MTWorks in this browser — no setup needed. Only set an override below if you specifically need to view someone else's data (e.g. a PM checking a report they manage).</p>

  <label for="memberId">Member ID override (optional)</label>
  <input type="text" id="memberId" placeholder="Leave blank to auto-detect your own login" />
  <br/>
  <button id="saveBtn">Save override</button>
  <button id="clearBtn" class="secondary">Clear override</button>
  <span id="savedMsg" style="display:none;"></span>

  <script src="options.js"></script>
</body>
</html>
